<style>
  :root { --navy:#1b2a6b; --c:#ff3b30; --sw:min(54px, calc((100dvh - 112px - 6 * 8px) / 7)); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
  html,body { height:100%; margin:0; overflow:hidden; overscroll-behavior:none; touch-action:none; }
  body { background:linear-gradient(160deg,#7be0ff,#b6a6ff 55%,#ffb3e6); position:fixed; inset:0; }
  #view { position:fixed; inset:0; width:100vw; height:100dvh; display:block; touch-action:none; cursor:crosshair; }

  .btn:active { transform:translateY(4px); box-shadow:0 1px 0 var(--navy); }

  #clearBtn { top:calc(10px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right)); background:#ff8787; }
  #tools { position:fixed; left:calc(10px + env(safe-area-inset-left)); top:50%; transform:translateY(-50%); margin-top:32px;
           display:flex; flex-direction:column; gap:10px; z-index:4; }
  #tools button { position:relative; width:min(68px, calc((100dvh - 130px) / 4 - 10px)); aspect-ratio:1; border-radius:22px; border:4px solid var(--navy);
                  background:#fff; box-shadow:0 5px 0 var(--navy); padding:6px; cursor:pointer; transition:transform .12s, background .12s; }
  #tools button svg { width:100%; height:100%; }
  #tools button.on { background:#b2f2bb; transform:translateX(8px) scale(1.08); }
  #palette { position:fixed; right:calc(10px + env(safe-area-inset-right)); top:calc(90px + env(safe-area-inset-top)); z-index:4;
             display:grid; grid-template-columns:repeat(2, var(--sw)); gap:8px; padding:8px; border-radius:24px;
             background:#fffc; border:4px solid var(--navy); }
  #palette button { width:var(--sw); height:var(--sw); border-radius:50%; border:3px solid var(--navy); padding:0; cursor:pointer;
                    transition:transform .12s; }
  #palette button.on { transform:scale(1.15); box-shadow:0 0 0 4px #fff, 0 0 0 8px var(--navy); z-index:1; }
  #palette button.hold { transform:scale(1.3); transition:transform .55s ease-in; }
  #colorEdit { position:fixed; inset:0; z-index:15; background:#1b2a6bcc; display:flex; align-items:center; justify-content:center; padding:12px; }
  #colorEdit .card { position:relative; background:#fff; border:5px solid var(--navy); border-radius:30px; padding:14px; box-shadow:0 8px 0 var(--navy);
                     --ce:min(56px, calc((100vw - 110px) / 12 - 6px), calc((100dvh - 90px) / 5 - 6px)); }
  #ceGrid { display:grid; grid-template-columns:repeat(12, var(--ce)); gap:6px; }

  #ceGrid button.on { box-shadow:0 0 0 3px #fff, 0 0 0 7px var(--navy); }
  #ceClose { position:absolute; top:-24px; right:-24px; width:52px; height:52px; border-radius:50%; border:4px solid var(--navy);
             background:#fff; padding:8px; cursor:pointer; }
  #ceClose svg { width:100%; height:100%; }
  #confirm { position:fixed; top:calc(4px + env(safe-area-inset-top)); right:calc(94px + env(safe-area-inset-right)); z-index:6;
             background:#fff; border:4px solid var(--navy); border-radius:24px; padding:6px; display:flex; gap:12px; box-shadow:0 6px 0 var(--navy); }
  #confirm::before { content:""; position:absolute; right:-16px; top:26px; border:12px solid transparent; border-right:0; border-left:12px solid var(--navy); }
  #confirm button { width:64px; height:64px; border-radius:50%; border:4px solid var(--navy); cursor:pointer; padding:8px; }
  #confirm svg { width:100%; height:100%; }

                 padding:16px; max-width:min(1100px, 100%); max-height:100%; overflow:auto; touch-action:pan-y; position:relative; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(180px, 40vw), 1fr)); gap:14px; }
  #grid button { background:#fff; border:4px solid var(--navy); border-radius:20px; padding:6px; aspect-ratio:4/3; cursor:pointer;
                 box-shadow:0 5px 0 var(--navy); display:flex; align-items:center; justify-content:center; }
  #grid button:active { transform:translateY(4px); box-shadow:0 1px 0 var(--navy); }

  #closePicker { position:sticky; top:0; float:right; margin:-4px -4px 8px 8px; width:56px; height:56px; border-radius:50%;

              border:4px solid var(--navy); background:#ffc9de; padding:9px; z-index:1; cursor:pointer; }
  #apkBtn { position:sticky; top:0; float:left; margin:-4px 8px 8px 0; width:56px; height:56px; border-radius:50%;
            border:4px solid var(--navy); background:#b2f2bb; padding:9px; z-index:1; cursor:pointer; display:flex; }

                  border:5px solid var(--navy); border-radius:30px; padding:22px 22px 14px; box-shadow:0 8px 0 var(--navy);

<script>
"use strict";
// Running inside the Android WebView wrapper (android/): no service worker, no full-screen prompt, no APK download.
const androidApp = !!window.AndroidBridge;
const W = 2400, H = 1800;
const TEMPLATES = ["unicorn", "garden", "sea", "castle", "dinosaur", "space", "farm", "butterfly", "train", "jungle",
                   // CC0 / public domain, see public/templates/CREDITS.md
                   "octopus", "koala", "giraffe", "sheep", "panda", "reindeer", "pumpkin", "xmastree", "icecream", "rainbow", "rescue",
                   // original seasonal pages (generated, no third-party source)
                   "snowman", "bunny", "beach", "autumn", "ghost"];
const DEFAULT_COLORS = ["#ff3b30", "#ff9500", "#ffd60a", "#a3e635", "#22a33a", "#5ac8fa", "#1e5bff", "#8e44ad",
                        "#ff6fb5", "#8b5a2b", "#f5c9a0", "#8e8e93", "#111111", "#ffffff"];
const TOOLS = { pencil: { width: 10 }, brush: { width: 44 }, eraser: { width: 80 }, bucket: {} };

const $ = id => document.getElementById(id);
const view = $("view"), vctx = view.getContext("2d");
const mk = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; return c; };
const paint = mk(), pctx = paint.getContext("2d", { willReadFrequently: true });
const backup = mk(), bctx = backup.getContext("2d");
const tpl = mk(), tctx = tpl.getContext("2d", { willReadFrequently: true });
let tplAlpha = null;       // Uint8Array of template line darkness (0 = white/transparent), null = blank page
let tplId = "";

const prefs = JSON.parse(localStorage.getItem("malen-prefs") || "{}");
let tool = TOOLS[prefs.tool] ? prefs.tool : "brush";
// Palette slots are customisable (long-press a swatch); the selection is a slot index, since slots may share a colour.
const savedPalette = JSON.parse(localStorage.getItem("malen-palette") || "null");
const palette = Array.isArray(savedPalette) && savedPalette.length === DEFAULT_COLORS.length && savedPalette.every(c => /^#[0-9a-f]{6}$/.test(c))
  ? savedPalette : DEFAULT_COLORS.slice();
let slot = Number.isInteger(prefs.slot) && prefs.slot >= 0 && prefs.slot < palette.length ? prefs.slot : 0;
let color = palette[slot];
const savePrefs = () => localStorage.setItem("malen-prefs", JSON.stringify({ tool, slot }));

/* ---------- view transform ---------- */
let scale = 1, tx = 0, ty = 0, fitScale = 1, dpr = 1, dirty = false;
function fit() {
  const vw = innerWidth, vh = innerHeight;
  const left = $("tools").getBoundingClientRect().right + 12;
  const right = vw - $("palette").getBoundingClientRect().left + 12;
  const aw = Math.max(100, vw - left - right), ah = Math.max(100, vh - 16);
  fitScale = scale = Math.min(aw / W, ah / H);
  tx = left + (aw - W * scale) / 2; ty = (vh - H * scale) / 2;
  redraw();
}
function resize() {
  dpr = window.devicePixelRatio || 1;
  view.width = Math.round(innerWidth * dpr); view.height = Math.round(innerHeight * dpr);
  fit();
}
function clampView() {
  const m = 120, vw = innerWidth, vh = innerHeight;
  tx = Math.min(vw - m, Math.max(m - W * scale, tx));
  ty = Math.min(vh - m, Math.max(m - H * scale, ty));
}
const redraw = () => { if (!dirty) { dirty = true; requestAnimationFrame(render); } };
function render() {
  dirty = false;
  vctx.setTransform(1, 0, 0, 1, 0, 0);
  vctx.clearRect(0, 0, view.width, view.height);
  vctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * tx, dpr * ty);
  vctx.imageSmoothingEnabled = true; vctx.imageSmoothingQuality = "high";
  vctx.shadowColor = "#1b2a6b55"; vctx.shadowBlur = 24 * dpr; vctx.shadowOffsetY = 6 / scale;
  vctx.fillStyle = "#fff"; vctx.fillRect(0, 0, W, H);
  vctx.shadowColor = "transparent"; vctx.shadowBlur = 0; vctx.shadowOffsetY = 0;
  vctx.drawImage(paint, 0, 0);
  // Multiply: white areas of the template (occluding fills) let paint through, black lines stay on top.
  if (tplAlpha) { vctx.globalCompositeOperation = "multiply"; vctx.drawImage(tpl, 0, 0); vctx.globalCompositeOperation = "source-over"; }
}
const toDoc = (x, y) => [(x - tx) / scale, (y - ty) / scale];

/* ---------- drawing ---------- */
let stroke = null;  // { id, last:[x,y], mid:[x,y] }
function strokeStyle() {
  pctx.globalCompositeOperation = tool === "eraser" ? "destination-out" : "source-over";
  pctx.strokeStyle = pctx.fillStyle = tool === "eraser" ? "#000" : color;
  pctx.lineWidth = TOOLS[tool].width; pctx.lineCap = "round"; pctx.lineJoin = "round";
}
function startStroke(id, x, y) {
  bctx.clearRect(0, 0, W, H); bctx.drawImage(paint, 0, 0);
  const p = toDoc(x, y);
  stroke = { id, last: p, mid: p };
  strokeStyle();
  pctx.beginPath(); pctx.arc(p[0], p[1], TOOLS[tool].width / 2, 0, Math.PI * 2); pctx.fill();
  redraw();
}
function extendStroke(x, y) {
  const p = toDoc(x, y), { last, mid } = stroke;
  const m = [(last[0] + p[0]) / 2, (last[1] + p[1]) / 2];
  pctx.beginPath(); pctx.moveTo(mid[0], mid[1]); pctx.quadraticCurveTo(last[0], last[1], m[0], m[1]); pctx.stroke();
  stroke.last = p; stroke.mid = m;
}
function endStroke() {
  const { last, mid } = stroke;
  pctx.beginPath(); pctx.moveTo(mid[0], mid[1]); pctx.lineTo(last[0], last[1]); pctx.stroke();
  pctx.globalCompositeOperation = "source-over";
  stroke = null; redraw(); scheduleSave();
}
function cancelStroke() {
  pctx.globalCompositeOperation = "copy"; pctx.drawImage(backup, 0, 0);
  pctx.globalCompositeOperation = "source-over";
  stroke = null; redraw();
}

/* ---------- bucket fill ---------- */
function bucket(x, y) {
  const [fx, fy] = toDoc(x, y);
  const sx = Math.floor(fx), sy = Math.floor(fy);
  if (sx < 0 || sy < 0 || sx >= W || sy >= H) return;
  const N = W * H, seed = sy * W + sx;
  if (tplAlpha && tplAlpha[seed] > 80) return;          // tapped on a line
  const img = pctx.getImageData(0, 0, W, H), d = img.data;
  // Composite paint over white into packed RGB.
  const comp = new Uint32Array(N);
  for (let i = 0, j = 0; i < N; i++, j += 4) {
    const a = d[j + 3];
    if (a === 0) { comp[i] = 0xffffff; continue; }
    const k = 255 - a;
    comp[i] = (((d[j] * a + 255 * k) / 255) << 16) | (((d[j + 1] * a + 255 * k) / 255) << 8) | ((d[j + 2] * a + 255 * k) / 255);
  }
  const s = comp[seed], sr = s >> 16, sg = (s >> 8) & 255, sb = s & 255;
  const cr = parseInt(color.slice(1, 3), 16), cg = parseInt(color.slice(3, 5), 16), cb = parseInt(color.slice(5, 7), 16);
  if (Math.abs(sr - cr) < 8 && Math.abs(sg - cg) < 8 && Math.abs(sb - cb) < 8) return;
  const TOL = 60, line = tplAlpha;
  const mask = new Uint8Array(N);
  const ok = i => {
    if (mask[i] || (line && line[i] > 80)) return false;
    const c = comp[i];
    return Math.abs((c >> 16) - sr) <= TOL && Math.abs(((c >> 8) & 255) - sg) <= TOL && Math.abs((c & 255) - sb) <= TOL;
  };
  let x0 = sx, x1 = sx, y0 = sy, y1 = sy;
  const stack = [seed];
  while (stack.length) {
    const i = stack.pop();
    if (!ok(i)) continue;
    const y = (i / W) | 0, row = y * W;
    let l = i, r = i;
    while (l > row && ok(l - 1)) l--;
    while (r < row + W - 1 && ok(r + 1)) r++;
    let upOpen = false, downOpen = false;
    for (let k = l; k <= r; k++) {
      mask[k] = 1;
      if (y > 0) { const u = ok(k - W); if (u && !upOpen) stack.push(k - W); upOpen = u; }
      if (y < H - 1) { const v = ok(k + W); if (v && !downOpen) stack.push(k + W); downOpen = v; }
    }
    if (l - row < x0) x0 = l - row; if (r - row > x1) x1 = r - row;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  // Dilate by R px inside the bbox so no white halo remains against anti-aliased edges.
  const R = 2;
  x0 = Math.max(0, x0 - R); x1 = Math.min(W - 1, x1 + R); y0 = Math.max(0, y0 - R); y1 = Math.min(H - 1, y1 + R);
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  const tmp = new Uint8Array(bw * bh);
  for (let y = y0; y <= y1; y++) {
    const row = y * W, o = (y - y0) * bw;
    for (let x = x0; x <= x1; x++) {
      let v = 0;
      for (let k = Math.max(x0, x - R), e = Math.min(x1, x + R); k <= e && !v; k++) v = mask[row + k];
      tmp[o + x - x0] = v;
    }
  }
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      let v = 0;
      for (let k = Math.max(y0, y - R), e = Math.min(y1, y + R); k <= e && !v; k++) v = tmp[(k - y0) * bw + x - x0];
      if (v) { const j = (y * W + x) * 4; d[j] = cr; d[j + 1] = cg; d[j + 2] = cb; d[j + 3] = 255; }
    }
  }
  pctx.putImageData(img, 0, 0, x0, y0, bw, bh);
  redraw(); scheduleSave();
}

/* ---------- pointers & gestures ---------- */
const pts = new Map();     // pointerId -> {x, y}
let gesture = null;        // { d0, m0:[x,y], s0, tx0, ty0 }
let locked = false;        // after a pinch, ignore remaining fingers until all lift
let tap = null;            // bucket candidate { id, x, y }
let pan = null;            // mouse right/middle drag
const mid2 = () => { const [a, b] = [...pts.values()]; return [(a.x + b.x) / 2, (a.y + b.y) / 2, Math.hypot(a.x - b.x, a.y - b.y)]; };

view.addEventListener("pointerdown", e => {
  e.preventDefault();
  hideConfirm();
  if (e.pointerType === "mouse" && e.button !== 0) { pan = { x: e.clientX, y: e.clientY }; view.setPointerCapture(e.pointerId); return; }
  view.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1 && !locked) {
    if (tool === "bucket") tap = { id: e.pointerId, x: e.clientX, y: e.clientY };
    else startStroke(e.pointerId, e.clientX, e.clientY);
  } else if (pts.size === 2) {
    if (stroke) cancelStroke();
    tap = null; locked = true;
    const [mx, my, d] = mid2();
    gesture = { d0: Math.max(d, 1), m0: [mx, my], s0: scale, tx0: tx, ty0: ty };
  }
});
view.addEventListener("pointermove", e => {
  if (pan) { tx += e.clientX - pan.x; ty += e.clientY - pan.y; pan = { x: e.clientX, y: e.clientY }; clampView(); redraw(); return; }
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (gesture && pts.size >= 2) {
    const [mx, my, d] = mid2(), g = gesture;
    scale = Math.min(8, Math.max(fitScale * 0.5, g.s0 * d / g.d0));
    const dx = (g.m0[0] - g.tx0) / g.s0, dy = (g.m0[1] - g.ty0) / g.s0;
    tx = mx - dx * scale; ty = my - dy * scale;
    clampView(); redraw();
  } else if (stroke && stroke.id === e.pointerId) {
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const c of (evs.length ? evs : [e])) extendStroke(c.clientX, c.clientY);
    redraw();
  } else if (tap && tap.id === e.pointerId && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > 24) tap = null;
});
function lift(e) {
  if (pan) { pan = null; return; }
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (stroke && stroke.id === e.pointerId) { e.type === "pointercancel" ? cancelStroke() : endStroke(); }
  if (tap && tap.id === e.pointerId) { if (e.type === "pointerup") bucket(tap.x, tap.y); tap = null; }
  if (pts.size < 2) gesture = null;
  if (pts.size === 0) locked = false;
}
view.addEventListener("pointerup", lift);
view.addEventListener("pointercancel", lift);
view.addEventListener("wheel", e => {
  e.preventDefault();
  const k = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015));
  const ns = Math.min(8, Math.max(fitScale * 0.5, scale * k));
  const [dx, dy] = toDoc(e.clientX, e.clientY);
  scale = ns; tx = e.clientX - dx * scale; ty = e.clientY - dy * scale;
  clampView(); redraw();
}, { passive: false });
for (const t of ["contextmenu", "gesturestart", "gesturechange", "dblclick"])
  document.addEventListener(t, e => e.preventDefault(), { passive: false });
document.addEventListener("selectstart", e => {
  const el = e.target.nodeType === Node.ELEMENT_NODE ? e.target : e.target.parentElement;
  if (!el?.closest("#donate")) e.preventDefault();
});
document.addEventListener("touchmove", e => { if (!e.target.closest(".box, #donate .card")) e.preventDefault(); }, { passive: false });

/* ---------- UI ---------- */
function setTool(t) {
  tool = t; savePrefs();
  for (const b of $("tools").children) b.classList.toggle("on", b.dataset.tool === t);
}
function setSlot(i) {
  slot = i; color = palette[i]; savePrefs();
  document.documentElement.style.setProperty("--c", color);
  [...$("palette").children].forEach((b, k) => { b.style.background = palette[k]; b.classList.toggle("on", k === i); });
}
for (const b of $("tools").children) b.addEventListener("click", () => setTool(b.dataset.tool));

// Tap selects a slot; holding ~0.55 s opens the colour chooser for that slot.
// The click from lifting the held finger lands on the chooser that just opened, so it is swallowed once;
// `held` resets on the next pointerdown in case the lift produced no click.
let holdTimer = 0, held = false, holdAt = null;
const cancelHold = () => { clearTimeout(holdTimer); holdTimer = 0; for (const b of $("palette").children) b.classList.remove("hold"); };
document.addEventListener("pointerdown", () => { held = false; }, true);
document.addEventListener("click", e => { if (held) { held = false; e.stopPropagation(); e.preventDefault(); } }, true);
palette.forEach((_, i) => {
  const b = document.createElement("button");
  b.setAttribute("aria-label", `Farbe ${i + 1}`);
  b.addEventListener("pointerdown", e => {
    holdAt = [e.clientX, e.clientY]; cancelHold();
    b.classList.add("hold");
    holdTimer = setTimeout(() => { cancelHold(); held = true; openColorEdit(i); }, 550);
  });
  b.addEventListener("pointermove", e => { if (holdTimer && Math.hypot(e.clientX - holdAt[0], e.clientY - holdAt[1]) > 12) cancelHold(); });
  for (const t of ["pointerup", "pointercancel", "pointerleave"]) b.addEventListener(t, cancelHold);
  b.addEventListener("click", () => { setSlot(i); if (tool === "eraser") setTool("brush"); });
  $("palette").append(b);
});

const hsl = (h, s, l) => {
  const f = n => { const k = (n + h / 30) % 12, a = s * Math.min(l, 1 - l); return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  return "#" + [f(0), f(8), f(4)].map(v => v.toString(16).padStart(2, "0")).join("");
};
// 12 hues x 4 shades, then greys and skin tones.
const CHOICES = [
  ...[0.85, 0.7, 0.55, 0.38].flatMap(l => Array.from({ length: 12 }, (_, k) => hsl(k * 30, 0.9, l))),
  "#ffffff", "#e0e0e0", "#bdbdbd", "#9e9e9e", "#6e6e6e", "#3d3d3d", "#111111",
  "#fde0c5", "#f5c9a0", "#e0a878", "#c68642", "#8d5524",
];
let editSlot = -1;
function openColorEdit(i) {
  editSlot = i;
  const grid = $("ceGrid");
  if (!grid.children.length) for (const c of CHOICES) {
    const b = document.createElement("button");
    b.dataset.color = c; b.style.background = c; b.setAttribute("aria-label", c);
    b.addEventListener("click", () => {
      palette[editSlot] = c; localStorage.setItem("malen-palette", JSON.stringify(palette));
      setSlot(editSlot); if (tool === "eraser") setTool("brush");
      closeColorEdit();
    });
    grid.append(b);
  }
  for (const b of grid.children) b.classList.toggle("on", b.dataset.color === palette[i]);
  $("colorEdit").hidden = false;
}
const closeColorEdit = () => { $("colorEdit").hidden = true; editSlot = -1; };
$("ceClose").addEventListener("click", closeColorEdit);
$("colorEdit").addEventListener("click", e => { if (e.target.id === "colorEdit") closeColorEdit(); });

let confirmTimer = 0;
const hideConfirm = () => { $("confirm").hidden = true; clearTimeout(confirmTimer); };
$("clearBtn").addEventListener("click", () => {
  if (!$("confirm").hidden) return hideConfirm();
  $("confirm").hidden = false; clearTimeout(confirmTimer); confirmTimer = setTimeout(hideConfirm, 5000);
});
$("no").addEventListener("click", hideConfirm);
$("yes").addEventListener("click", () => { hideConfirm(); pctx.clearRect(0, 0, W, H); redraw(); scheduleSave(); });

const blankIcon = '<svg viewBox="0 0 48 48" fill="none" stroke="#1b2a6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4 H30 L40 14 V44 H10 Z M30 4 V14 H40"/></svg>';
function openPicker() {
  hideConfirm();
  const grid = $("grid");
  if (!grid.children.length) {
    for (const id of ["", ...TEMPLATES]) {
      const b = document.createElement("button");
      b.dataset.id = id;
      b.innerHTML = id ? `<img src="templates/${id}.svg" alt="${id}" draggable="false">` : blankIcon;
      b.addEventListener("click", async () => { closePicker(); pctx.clearRect(0, 0, W, H); fit(); await loadTemplate(id); scheduleSave(); });
      grid.append(b);
    }
  }
  for (const b of grid.children) b.classList.toggle("on", b.dataset.id === tplId);
  $("picker").hidden = false;
}
const closePicker = () => { $("picker").hidden = true; };
$("tplBtn").addEventListener("click", openPicker);
$("closePicker").addEventListener("click", closePicker);
$("picker").addEventListener("click", e => { if (e.target.id === "picker") closePicker(); });

/* ---------- donate (PayPal hosted button, loaded only on demand so the app stays offline-first) ---------- */
const PAYPAL_SDK = "https://www.paypal.com/sdk/js?client-id=BAA3I7Ebq_jrRrnlIQTorf96Vylh95OQRNrqVHNIKrAZwR_W_TSGVwxmFpKQHdeP5y6_VcXKmOZ57oqBc8&components=hosted-buttons&disable-funding=venmo&currency=EUR";
let paypalState = "idle";   // idle | loading | ready
function donateNote(text) { $("donateNote").textContent = text; $("donateNote").hidden = !text; }
function loadPaypal() {
  if (paypalState !== "idle") return;
  if (!navigator.onLine) return donateNote("You're offline. Connect to the internet to donate.");
  paypalState = "loading"; donateNote("Loading…");
  const s = document.createElement("script");
  s.src = PAYPAL_SDK;
  s.onload = () => {
    paypal.HostedButtons({ hostedButtonId: "7TRVZVKH42ZM6" }).render("#paypal-container-7TRVZVKH42ZM6")
      .then(() => { paypalState = "ready"; donateNote(""); })
      .catch(() => { paypalState = "idle"; donateNote("PayPal couldn't be loaded. Please try again later."); });
  };
  s.onerror = () => { s.remove(); paypalState = "idle"; donateNote("PayPal couldn't be loaded. Please try again later."); };
  document.head.append(s);
}
// Parent gate: a fresh multiplication every time the modal opens; PayPal only loads once it's solved.
let gateAnswer = 0;
function newQuestion() {
  const a = 3 + Math.floor(Math.random() * 7), b = 6 + Math.floor(Math.random() * 4);
  gateAnswer = a * b;
  $("gateQ").textContent = `${a} × ${b} = ?`;
  $("gateA").value = "";
}
function openDonate() {
  closePicker();
  newQuestion();
  $("gate").hidden = false; $("pay").hidden = true; $("gate").classList.remove("wrong");
  $("donate").hidden = false;
  $("gateA").focus();
}
$("gate").addEventListener("submit", e => {
  e.preventDefault();
  if (Number($("gateA").value.trim()) === gateAnswer && $("gateA").value.trim() !== "") {
    $("gateA").blur();
    if (androidApp) {
      // The WebView can't render the PayPal SDK button; open PayPal's hosted page in the system browser instead.
      closeDonate();
      window.AndroidBridge.openUrl("https://www.paypal.com/ncp/payment/7TRVZVKH42ZM6");
      return;
    }
    $("gate").hidden = true; $("pay").hidden = false;
    loadPaypal();
  } else {
    $("gate").classList.remove("wrong"); void $("gate").offsetWidth; $("gate").classList.add("wrong");
    newQuestion();
  }
});
const closeDonate = () => { $("gateA").blur(); $("donate").hidden = true; };
$("heartBtn").addEventListener("click", openDonate);
// Donations only on the real deployment: served over HTTPS or running under the service worker.
const showHeart = () => { $("heartBtn").hidden = !(location.protocol === "https:" || navigator.serviceWorker?.controller); };
navigator.serviceWorker?.addEventListener("controllerchange", showHeart);
showHeart();
// The APK only exists where it was built (GitHub Pages CI, or a local `bun android/build.ts`), so probe for it.
if (!androidApp) fetch("malen.apk", { method: "HEAD" }).then(r => { $("apkBtn").hidden = !r.ok; }).catch(() => {});
$("closeDonate").addEventListener("click", closeDonate);
$("donate").addEventListener("click", e => { if (e.target.id === "donate") closeDonate(); });

async function loadTemplate(id) {
  tplId = id;
  tctx.clearRect(0, 0, W, H);
  tplAlpha = null;
  if (id) {
    const img = new Image();
    img.src = `templates/${id}.svg`;
    try { await img.decode(); } catch { tplId = ""; redraw(); return; }
    tctx.drawImage(img, 0, 0, W, H);
    const d = tctx.getImageData(0, 0, W, H).data, a = new Uint8Array(W * H);
    for (let i = 0, j = 0; i < a.length; i++, j += 4) a[i] = d[j + 3] * (765 - d[j] - d[j + 1] - d[j + 2]) / 765;
    tplAlpha = a;
  }
  redraw();
}

/* ---------- persistence (IndexedDB) ---------- */
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open("malen", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("kv");
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const idb = (mode, fn) => dbp.then(db => new Promise((res, rej) => {
  const t = db.transaction("kv", mode), q = fn(t.objectStore("kv"));
  t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error);
}));
let saveTimer = 0;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => paint.toBlob(blob => idb("readwrite", s => s.put({ tpl: tplId, blob }, "drawing")).catch(console.error), "image/png"), 600);
}
addEventListener("pagehide", () => { if (saveTimer) { clearTimeout(saveTimer); paint.toBlob(blob => idb("readwrite", s => s.put({ tpl: tplId, blob }, "drawing")), "image/png"); } });

async function restore() {
  let saved = null;
  try { saved = await idb("readonly", s => s.get("drawing")); } catch (e) { console.error(e); }
  await loadTemplate(saved ? saved.tpl : "unicorn");
  if (saved && saved.blob) {
    try { const bmp = await createImageBitmap(saved.blob); pctx.drawImage(bmp, 0, 0); bmp.close(); } catch (e) { console.error(e); }
  }
  redraw();
}

/* ---------- full screen suggestion ---------- */
// Browser tabs only: shown whenever the page isn't full screen (on load and after leaving it), unless dismissed for this session.
// Skipped in the installed app (any non-browser display mode, iOS home-screen) and where the Fullscreen API is missing (iPhone Safari).
const de = document.documentElement;
const requestFs = de.requestFullscreen || de.webkitRequestFullscreen;
const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
// Evaluated once at load: Chrome also reports display-mode "fullscreen" for a tab in API full screen.
const inApp = androidApp || navigator.standalone === true || !matchMedia("(display-mode: browser)").matches;
let fsDismissed = sessionStorage.getItem("malen-fs-no") === "1";
function suggestFullscreen() { $("fsPrompt").hidden = inApp || !requestFs || fsDismissed || isFs() || !$("picker").hidden || !$("colorEdit").hidden; }
$("fsGo").addEventListener("click", () => {
  $("fsPrompt").hidden = true;
  Promise.resolve(requestFs.call(de, { navigationUI: "hide" })).catch(() => {});
});
$("fsNo").addEventListener("click", () => { fsDismissed = true; sessionStorage.setItem("malen-fs-no", "1"); $("fsPrompt").hidden = true; });
$("fsPrompt").addEventListener("click", e => { if (e.target.id === "fsPrompt") $("fsNo").click(); });
for (const t of ["fullscreenchange", "webkitfullscreenchange"]) document.addEventListener(t, () => setTimeout(suggestFullscreen, 400));
setTimeout(suggestFullscreen, 600);

setSlot(slot); setTool(tool);
addEventListener("resize", resize);
resize();
restore();
if ("serviceWorker" in navigator && !androidApp) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
